#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/padavanonly-immortalwrt-mt798x-6.6-builder.yml
# Description: TKubeOS — Netcore N60 PRO 定制固件云编译（237 6.6线 / 6.6内核）
#

name: TKubeOS-6.6-builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: padavanonly-immortalwrt-mt798x-6.6.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part5-6.6.sh
  # 界面主题仓库（如需换成带 CSS 定制的 fork/tag，只改下面两行）
  THEME_SHADCN_REPO: https://github.com/eamonxg/luci-theme-shadcn
  THEME_FOOTSTRAP_REPO: https://github.com/VizzleTF/luci-theme-footstrap
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  FIRMWARE_TAG: TKubeOS-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        # ===== 首次联网自动升级 Xray 内核到 26.6.27 =====
        # 底座 Go 1.23.12 无法编译新版 Xray（要求 go≥1.26），故编译时用官方旧版 25.2.21 占位，
        # 路由器首次联网时按顺序尝试 6 个反代拉官方预编译二进制替换（带体积/完整性校验，不走直连）。
        # 重试策略：只有升级成功才删除脚本；失败则每次开机自动重试（脚本自存档再重新注册）。
        # 首次启动生效前代理暂不可用；失败也不影响固件本身。
        mkdir -p $GITHUB_WORKSPACE/files/etc/uci-defaults
        cat > $GITHUB_WORKSPACE/files/etc/uci-defaults/97-upgrade-xray <<'XRAYEOF'
        #!/bin/sh
        # Xray 内核首启自动升级：只有升级成功才删除脚本，失败则下次开机自动重试。
        # 注意：uci-defaults 运行器会在脚本 exit 0 后主动删脚本，故先存档自身，失败时重新注册。
        SELF=/usr/share/tkubeos/upgrade-xray
        mkdir -p /usr/share/tkubeos
        [ -f "$SELF" ] || cp /etc/uci-defaults/97-upgrade-xray "$SELF"
        (
          XRAY_VER="26.6.27"
          REL="https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VER}/Xray-linux-arm64-v8a.zip"
          # 反代列表（前缀拼接型）：按顺序逐个尝试，不可用自动切下一个，不走 GitHub 直连
          PROXIES="https://gh.tkubeos.com/ https://gh.wisr.cn/ https://ghfast.top/ https://gh-proxy.com/ https://fastgit.cc/ https://githubdog.com/"
          ok=0
          # 本次开机最多 8 轮，轮间隔 15 分钟；每轮先等外网就绪（最多 20 分钟）
          round=0
          while [ $ok -eq 0 ] && [ $round -lt 8 ]; do
            i=0
            while [ $i -lt 120 ]; do
              ping -c1 -W3 223.5.5.5 >/dev/null 2>&1 && break
              ping -c1 -W3 8.8.8.8 >/dev/null 2>&1 && break
              i=$((i+1))
              sleep 10
            done
            cd /tmp || exit 0
            # 每个源三重校验：非空 + 体积>10MB + zip 完整性，杜绝空文件/坏文件替换
            for p in $PROXIES; do
              rm -f xray_new.zip
              curl -fsSL -m 120 -o xray_new.zip "${p}${REL}" 2>/dev/null
              # 体积校验用 wc -c 而非 stat -c%s：237 固件的 BusyBox 未编入 stat（09/01 实锤：
              # stat 不存在导致比较恒为假，全部反代被误判不可用）
              if [ -s xray_new.zip ] && [ "$(wc -c < xray_new.zip)" -gt 10485760 ] && unzip -tq xray_new.zip >/dev/null 2>&1; then
                ok=1
                logger -t xray-upgrade "download ok via proxy ${p}"
                break
              fi
              logger -t xray-upgrade "proxy ${p} unavailable, trying next"
            done
            round=$((round+1))
            [ $ok -eq 0 ] && sleep 900
          done
          if [ $ok -eq 1 ]; then
            unzip -o -q xray_new.zip xray -d /tmp/xray_new_dir
            if [ -f /tmp/xray_new_dir/xray ]; then
              chmod 755 /tmp/xray_new_dir/xray
              if /tmp/xray_new_dir/xray -version >/dev/null 2>&1; then
                mv -f /tmp/xray_new_dir/xray /usr/bin/xray
                rm -f "$SELF" /etc/uci-defaults/97-upgrade-xray
                logger -t xray-upgrade "Xray upgraded to ${XRAY_VER}"
              fi
            fi
          else
            # 本次开机全部失败：重新注册到 uci-defaults，下次开机继续重试，直到成功为止
            cp -f "$SELF" /etc/uci-defaults/97-upgrade-xray 2>/dev/null
            chmod +x /etc/uci-defaults/97-upgrade-xray 2>/dev/null
            logger -t xray-upgrade "all proxies failed this boot, will retry on next boot"
          fi
          rm -rf /tmp/xray_new.zip /tmp/xray_new_dir
        ) &
        exit 0
        XRAYEOF
        chmod +x $GITHUB_WORKSPACE/files/etc/uci-defaults/97-upgrade-xray
        # ===== ttyd 服务禁用脚本（兜底）=====
        # 万一仍有依赖路径把 ttyd 守护进程带进固件，首启时禁用并停止其 init，
        # 确保 7681 端口的网页终端不会运行（与下面删默认包、config not set 构成三重保险）。
        cat > $GITHUB_WORKSPACE/files/etc/uci-defaults/98-disable-ttyd <<'TTYDEOF'
        #!/bin/sh
        if [ -x /etc/init.d/ttyd ]; then
        	/etc/init.d/ttyd disable 2>/dev/null
        	/etc/init.d/ttyd stop 2>/dev/null
        	logger -t tkubeos "ttyd init disabled and stopped"
        fi
        exit 0
        TTYDEOF
        chmod +x $GITHUB_WORKSPACE/files/etc/uci-defaults/98-disable-ttyd
        # ===== 出厂默认主题 = shadcn =====
        # 各主题自带的注册脚本（30_*）先跑，本脚本编号最大最后跑，对 mediaurlbase
        # 拥有“最后一句话”；sysupgrade -c 后新固件首启会重跑本脚本，默认主题恒为
        # shadcn；用户仍可在「系统→系统→语言和界面」临时切到 footstrap。
        cat > $GITHUB_WORKSPACE/files/etc/uci-defaults/99-set-default-theme <<'THEMEEOF'
        #!/bin/sh
        uci set luci.main.mediaurlbase='/luci-static/shadcn'
        uci commit luci
        exit 0
        THEMEEOF
        chmod +x $GITHUB_WORKSPACE/files/etc/uci-defaults/99-set-default-theme
        # ===== 移除 ttyd 网页终端全家（守护进程 + LuCI 应用 + 中文包）=====
        # 237 底座把 luci-app-ttyd 写死在 target/linux/mediatek/Makefile 的 DEFAULT_PACKAGES 里，
        # DEFAULT_PACKAGES 是无条件安装（不走 Kconfig），config 里 "is not set" 拦不住
        # （09/01 实锤：config 明确 not set，固件里照样装了 ttyd + luci-app-ttyd + 中文包并在监听 7681 端口）。
        # 只删包名不删整行：同一行还有 kmod-ipt-fullconenat、kmod-fs-btrfs 等其他默认包。
        # 删除顺序：先长名（i18n/app）后短名，避免 \b 词边界把 luci-app-ttyd 的尾巴误伤。
        sed -i -e 's/luci-i18n-ttyd-zh-cn //g' -e 's/luci-app-ttyd //g' -e 's/\bttyd\b//g' target/linux/mediatek/Makefile
        echo "########## 验证：ttyd 全家已从默认包移除 ##########"
        if grep -n 'ttyd' target/linux/mediatek/Makefile; then
          echo "!!! 警告：ttyd 相关条目仍残留于 mediatek Makefile !!!"
        else
          echo "确认：默认包已无任何 ttyd 条目"
        fi
        # ===== 钉死 luci-app-passwall 版本为 26.8.26-1 =====
        # feeds update 后 passwall feed 停在 main 最新，checkout 到 tag 钉住版本，
        # 避免上游后续更新导致固件行为变化。必须在 update -i 重建索引之前完成，
        # 否则索引记录的还是 main 的版本。
        cd feeds/passwall
        # feeds update 克隆时不会拉全 tag（08/31 实锤：checkout tags/xxx 报 pathspec did not match），
        # 必须先 fetch --tags 再 checkout
        git fetch --tags origin
        git checkout tags/26.8.26-1
        echo "########## 验证：passwall 钉版本结果（应为 26.8.26 / release 1）##########"
        grep -E 'PKG_VERSION|PKG_RELEASE' luci-app-passwall/Makefile
        # ===== 把 api.lua 里的 GitHub 反代地址换成自有的 =====
        # api.lua 两处硬编码（更新查询 + 内核下载）都是 https://gh-proxy.org/，
        # 要求前缀拼接型反代（反代地址/完整原始URL），gh.tkubeos.com 即自有反代。
        sed -i 's|https://gh-proxy.org/|https://gh.tkubeos.com/|g' luci-app-passwall/luasrc/passwall/api.lua
        echo "########## 验证：反代替换结果（应为 2 处 gh.tkubeos.com、0 处残留）##########"
        echo "gh.tkubeos.com 出现: $(grep -c 'gh\.tkubeos\.com' luci-app-passwall/luasrc/passwall/api.lua)"
        echo "gh-proxy.org 残留: $(grep -c 'gh-proxy\.org' luci-app-passwall/luasrc/passwall/api.lua || true)"
        # ===== Xray 更新按钮失效，但保留版本查看 =====
        # 内核已由首启脚本钉死 26.6.27，不能真的让界面更新它（会升到最新版破坏钉版本），
        # 但保留 Xray 行以便查看当前内核版本。做法：
        # 1) com.lua 的 _M.order 原生自带 "xray" 条目（26.8.26-1 上游就有），保持不动即可显示。
        #    切勿再插入条目：重复条目会让组件更新页出现两个 Xray，且保存时两个同名输入框
        #    会把 xray_file 写成重复 list → uci:get 返回 table → finded_com 崩溃（09/01 实锤）。
        # 2) api.lua 的 to_check 对 xray 短路：返回“已是最新”（界面能看到本地版本，永远不出现更新）
        # 3) api.lua 的 to_download 对 xray 短路：直接拒绝下载（双保险，任何路径都下载不了）
        sed -i 's|^function to_check(arch, app_name)|function to_check(arch, app_name)\n\tif app_name == "xray" then\n\t\tlocal v = get_app_version("xray") or "?"\n\t\treturn { code = 0, has_update = false, local_version = v, remote_version = v }\n\tend|' luci-app-passwall/luasrc/passwall/api.lua
        sed -i 's|^function to_download(app_name, url, size)|function to_download(app_name, url, size)\n\tif app_name == "xray" then\n\t\treturn { code = 1, error = "Xray 内核版本已锁定（首启脚本自动升级），请勿手动更新。" }\n\tend|' luci-app-passwall/luasrc/passwall/api.lua
        echo "########## 验证：xray 拦截注入（应为 2 拦截；com.lua 的 xray 条目应为 1）##########"
        grep -c 'app_name == "xray"' luci-app-passwall/luasrc/passwall/api.lua
        grep -c '"xray",' luci-app-passwall/luasrc/passwall/com.lua
        cd ../..
        # 官方 luci feed 内置了旧版 luci-app-passwall（25.12.x），同名包会挤掉我们的新源。
        # 必须三步走：1) 删掉官方内置版源码  2) update -i 重建索引（关键！只删目录不重建索引，
        # 旧索引仍会照旧版占位，导致 passwall feed 被静默跳过、零包安装）  3) 再 install。
        rm -rf feeds/luci/applications/luci-app-passwall
        ./scripts/feeds update -i
        ./scripts/feeds install -a
        rm -rf package/feeds/luci/luci-app-passwall package/feeds/luci/luci-i18n-passwall-zh-cn
        echo "########## 验证：passwall 包来源（必须指向 feeds/passwall）##########"
        ls -l package/feeds/*/luci-app-passwall || echo "!!! 严重警告：passwall 包未安装，固件将缺少 PassWall !!!"
        # ===== 屏蔽系统自带「备份 / 刷写固件」菜单入口 =====
        # 固件升级走 TKubeOS 自有「固件更新」页（授权 + 钉版本），配置备份走该页「生成备份」按钮。
        # 自带页可绕过授权刷任意镜像/恢复任意备份，必须从菜单摘除入口。
        # 09/02 实锤：新版 luci（26.x）已无 luci-mod-admin-full.json，菜单拆分到
        # luci-mod-system.json 等文件，且键名是 admin/system/flash（旧版为 flashops）。
        # 改为扫描全部 modules 的 menu.d JSON，两种键名都删；python3 改 JSON 不破坏结构。
        python3 - <<'PYEOF'
        import json, glob
        keys = ('admin/system/flashops', 'admin/system/flash')
        paths = sorted(glob.glob('feeds/luci/modules/*/root/usr/share/luci/menu.d/*.json'))
        if not paths:
            print('!!! 警告：feeds/luci/modules 下未找到任何 menu.d JSON，自带备份/升级页未屏蔽 !!!')
        for p in paths:
            with open(p, encoding='utf-8') as f:
                d = json.load(f)
            hit = [k for k in keys if k in d]
            if not hit:
                continue
            for k in hit:
                d.pop(k)
            with open(p, 'w', encoding='utf-8') as f:
                json.dump(d, f, indent='\t', ensure_ascii=False)
                f.write('\n')
            print('removed', hit, 'from', p)
        PYEOF
        echo "########## 验证：自带备份/升级菜单条目残留（应为 0）##########"
        grep -rn '"admin/system/flash' feeds/luci/modules/*/root/usr/share/luci/menu.d/ 2>/dev/null && echo "!!! 警告：admin/system/flash* 条目仍残留 !!!" || echo "确认：menu.d 已无 flash/flashops 条目"

    - name: Generate TKubeOS online update files
      run: |
        # ===== TKubeOS 在线更新功能（授权制，服务端 https://upfw.tkubeos.com）=====
        # LuCI“系统→固件更新”页面：显示机器号/型号/当前版本，检查授权与新版，“生成备份”下载当前配置 tar.gz；
        # “立即更新”= update start 立即返回 + 后台下载/校验/刷入，前端每 2 秒轮询
        # update status 渲染进度条与日志（旧版同步 exec 会在下载期间触发 RPC 超时“启动失败”）。
        # 版本/型号标识放 /usr/share/tkubeos/（每次刷机被新镜像覆盖，身份永远正确；
        # 放 /etc 会被 sysupgrade -c 保留旧值，形成“永远有更新”死循环——09/01 实锤）。
        # 刷入用 sysupgrade -c（保留配置）；本底座 -r 是恢复备份语义，带镜像会被拒绝。
        # 所有文件编译时由 heredoc 生成，随固件打包。依赖：curl（PassWall 带入）、
        # jsonfilter / md5sum / sha256sum（底座自带）、base64（config 已显式开启的 busybox 组件），均无需加包。
        mkdir -p $GITHUB_WORKSPACE/files/usr/sbin
        mkdir -p $GITHUB_WORKSPACE/files/www/luci-static/resources/view/tkubeos
        mkdir -p $GITHUB_WORKSPACE/files/usr/share/luci/menu.d
        mkdir -p $GITHUB_WORKSPACE/files/usr/share/rpcd/acl.d
        mkdir -p $GITHUB_WORKSPACE/files/usr/share/tkubeos
        cat > $GITHUB_WORKSPACE/files/usr/sbin/tkubeos-fwcheck <<'FWEOF'
        #!/bin/sh
        # TKubeOS 固件更新助手（由 LuCI 页面调用）
        # 用法: tkubeos-fwcheck {id|model|ver|check|update start|update status|backup start|backup read|backup clean}
        #   id            输出设备机器号（MAC 的 md5）
        #   model         输出设备型号（读 /etc/tkubeos_model，编译时写入）
        #   ver           输出当前固件版本
        #   check         向服务器查询授权与更新，输出 JSON
        #   update start  启动后台升级线程（零网络、立即返回；授权查询/下载/刷入全在后台，前端轮询 status 拿进度）
        #   update status 输出进度 JSON：{stage, percent, detail, log}
        #   update        （不带子命令=旧版同步模式，仅命令行调试用）
        #   backup start  生成当前配置备份（sysupgrade -b → /tmp 的 tar.gz），输出 {"size":N}
        #   backup read   读取备份分片：backup read <分片号从0起> <分片字节数>，输出该分片 base64
        #   backup clean  删除备份临时文件（前端下载完成后调用）
        
        # 授权更新服务地址（与服务端 config.php 的 API_DOMAIN 一致）
        API_BASE="https://upfw.tkubeos.com"
        FW_TMP="/tmp/tkubeos-firmware.bin"
        FW_STATE="/tmp/tkubeos-fw-state"
        FW_META="/tmp/tkubeos-fw-meta"
        FW_LOG="/tmp/tkubeos-fw.log"
        # 配置备份临时文件（tmpfs 重启即失；下载完由前端调 backup clean 主动清理。
        # 绝不落盘 /www：备份含密码与密钥，不能经静态 URL 暴露）
        BK_TMP="/tmp/tkubeos-backup.tar.gz"
        
        log() { echo "$(date '+%m-%d %H:%M:%S') $*" >> "$FW_LOG"; }
        
        machine_id() {
        	local mac
        	mac="$(cat /sys/class/net/eth0/address 2>/dev/null)"
        	[ -n "$mac" ] || mac="$(ip link 2>/dev/null | awk '/link\/ether/ {print $2; exit}')"
        	printf '%s' "$mac" | tr -d ':' | tr 'A-F' 'a-f' | md5sum | awk '{print $1}'
        }
        
        cur_ver() {
        	# 版本标识放在 /usr/share/tkubeos/（每次刷机必被新镜像覆盖，身份永远正确）；
        	# /etc/ 下的同名文件会被 sysupgrade -c 保留旧值，只作老固件兼容回退（09/01 实锤：
        	# 放 /etc 会导致升级后版本号被旧值覆盖，形成永远提示有更新的死循环）。
        	if [ -f /usr/share/tkubeos/version ]; then
        		cat /usr/share/tkubeos/version
        	elif [ -f /etc/tkubeos_version ]; then
        		cat /etc/tkubeos_version
        	else
        		. /etc/openwrt_release 2>/dev/null
        		echo "${DISTRIB_DESCRIPTION:-unknown}"
        	fi
        }
        
        fw_model() {
        	if [ -f /usr/share/tkubeos/model ]; then
        		cat /usr/share/tkubeos/model
        	elif [ -f /etc/tkubeos_model ]; then
        		cat /etc/tkubeos_model
        	else
        		# 老固件无型号文件，默认 n60pro
        		echo "n60pro"
        	fi
        }
        
        http_check() {
        	curl -s --max-time 20 -X POST "$API_BASE/check.php" \
        		-d "machine_id=$(machine_id)" \
        		-d "cur_ver=$(cur_ver)" \
        		-d "model=$(fw_model)"
        }
        
        # 最小 JSON 转义（反斜杠、双引号，换行变空格），用于把日志塞进 JSON
        json_escape() {
        	printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | tr '\n' ' '
        }
        
        # 查询授权并落盘 url/sha/size；失败时写 error 状态并返回非 0。
        # 不向 stdout 输出：本函数只被后台 worker 调用，错误信息由 update status 呈现。
        prepare_update() {
        	local resp auth has url sha size
        	resp="$(http_check)" || { echo "error:network" > "$FW_STATE"; return 1; }
        	auth="$(echo "$resp" | jsonfilter -e '@.authorized' 2>/dev/null)"
        	[ "$auth" = "true" ] || { echo "error:not-authorized" > "$FW_STATE"; return 2; }
        	has="$(echo "$resp" | jsonfilter -e '@.has_update' 2>/dev/null)"
        	[ "$has" = "true" ] || { echo "error:no-update" > "$FW_STATE"; return 3; }
        	url="$(echo "$resp" | jsonfilter -e '@.url' 2>/dev/null)"
        	sha="$(echo "$resp" | jsonfilter -e '@.sha256' 2>/dev/null)"
        	size="$(echo "$resp" | jsonfilter -e '@.size' 2>/dev/null)"
        	[ -n "$url" ] && [ -n "$sha" ] || { echo "error:bad-response" > "$FW_STATE"; return 4; }
        	# FW_STATE/FW_LOG 由 start 已清理，这里只清镜像临时文件（避免误删 preparing 日志）
        	rm -f "$FW_TMP"
        	printf '%s\n%s\n%s\n' "$url" "$sha" "$size" > "$FW_META"
        	echo "downloading" > "$FW_STATE"
        	return 0
        }
        
        # 后台工作线程：授权查询 → 下载 → 体积校验 → sha256 校验 → 刷入，全程写日志
        do_worker() {
        	local url sha size real got
        	# 授权查询放在 worker 内做：start 保持零网络秒回，避免慢网下 RPC 超时
        	# 让前端误报“启动失败”（09/01 实锤：后台升级其实照常完成、设备照常重启）
        	echo "preparing" > "$FW_STATE"
        	log "正在检查授权与更新信息…"
        	if ! prepare_update; then
        		log "未能获取更新（见状态提示），流程终止"
        		exit 1
        	fi
        	url="$(sed -n 1p "$FW_META" 2>/dev/null)"
        	sha="$(sed -n 2p "$FW_META" 2>/dev/null)"
        	size="$(sed -n 3p "$FW_META" 2>/dev/null)"
        	log "开始下载固件（服务器体积 ${size:-未知} 字节）"
        	if ! curl -sL --max-time 1800 -o "$FW_TMP" "$url"; then
        		echo "error:download-failed" > "$FW_STATE"
        		log "下载失败：网络中断或链接过期，请重新点击立即更新"
        		exit 5
        	fi
        	got="$(wc -c < "$FW_TMP" 2>/dev/null)"
        	if [ -z "$got" ] || [ "$got" -lt 5242880 ]; then
        		echo "error:bad-size" > "$FW_STATE"
        		log "下载文件异常（体积 ${got:-0}），已终止"
        		exit 6
        	fi
        	echo "verifying" > "$FW_STATE"
        	log "下载完成（$got 字节），正在校验完整性…"
        	real="$(sha256sum "$FW_TMP" | awk '{print $1}')"
        	if [ "$real" != "$sha" ]; then
        		echo "error:sha-mismatch" > "$FW_STATE"
        		log "校验失败：文件与服务器不一致，请重新点击立即更新"
        		exit 7
        	fi
        	log "校验通过，即将刷入并重启（保留配置）"
        	echo "flashing" > "$FW_STATE"
        	# 调试闸门：存在该文件时只校验不刷入（排查用，正式设备没有此文件）
        	if [ -f /tmp/tkubeos-fw-noflash ]; then
        		echo "done-noflash" > "$FW_STATE"
        		log "调试模式：校验通过，跳过刷入"
        		exit 0
        	fi
        	# 脱离当前会话刷入，避免 sysupgrade 杀进程时把自己杀掉。
        	# 注意：本底座（24.10）里 -r 是“恢复备份”语义，带镜像会被直接拒绝（09/01 实锤：
        	# 网页升级 4 次全部失败在此），保留配置要用 -c。
        	sleep 2
        	sysupgrade -c "$FW_TMP"
        }
        
        # 输出当前进度（前端每 2 秒轮询一次）
        do_status() {
        	local stage percent detail logtail cur size
        	stage="$(cat "$FW_STATE" 2>/dev/null)"
        	[ -n "$stage" ] || stage="idle"
        	percent=0
        	detail=""
        	case "$stage" in
        	preparing) percent=2; detail="正在检查授权与更新信息…" ;;
        	downloading)
        		cur="$(wc -c < "$FW_TMP" 2>/dev/null)"
        		[ -n "$cur" ] || cur=0
        		size="$(sed -n 3p "$FW_META" 2>/dev/null)"
        		if [ -n "$size" ] && [ "$size" -gt 0 ] 2>/dev/null; then
        			percent="$(awk -v c="$cur" -v s="$size" 'BEGIN{p=int(c*100/s); if(p>99)p=99; print p}')"
        			detail="$(awk -v c="$cur" -v s="$size" 'BEGIN{printf "已下载 %.1fMB / %.1fMB", c/1048576, s/1048576}')"
        		else
        			detail="$(awk -v c="$cur" 'BEGIN{printf "已下载 %.1fMB", c/1048576}')"
        		fi
        		;;
        	verifying) percent=100; detail="正在校验固件完整性" ;;
        	flashing) percent=100; detail="校验通过，正在刷入固件并重启" ;;
        	done-noflash) percent=100; detail="调试模式：校验通过（未刷入）" ;;
        	error:*)
        		case "$stage" in
        		error:network) detail="网络异常：无法连接更新服务器，请检查联网后重试" ;;
        		error:download-failed) detail="下载失败：网络中断或链接过期，请重新点击立即更新" ;;
        		error:bad-size) detail="下载文件异常（体积过小），请重新点击立即更新" ;;
        		error:sha-mismatch) detail="校验失败：文件与服务器不一致，请重新点击立即更新" ;;
        		error:not-authorized) detail="设备未激活，请把机器号发送给客服开通" ;;
        		error:no-update) detail="当前已是最新版本，无需更新" ;;
        		error:bad-response) detail="服务器响应异常，请稍后重试" ;;
        		*) detail="升级失败，请重新点击立即更新" ;;
        		esac ;;
        	esac
        	logtail="$(tail -n 3 "$FW_LOG" 2>/dev/null)"
        	printf '{"stage":"%s","percent":%s,"detail":"%s","log":"%s"}\n' \
        		"$stage" "$percent" "$(json_escape "$detail")" "$(json_escape "$logtail")"
        }
        
        case "$1" in
        id)
        	machine_id
        	;;
        model)
        	fw_model
        	;;
        ver)
        	cur_ver
        	;;
        check)
        	http_check
        	;;
        update)
        	case "$2" in
        	start)
        		# 防重复：已有后台线程在跑就直接返回（旧状态保持，前端继续轮询）
        		if pgrep -f 'tkubeos-fwcheck _worker' >/dev/null 2>&1; then
        			echo '{"started":true,"note":"already-running"}'
        			exit 0
        		fi
        		# start 必须零网络、立即返回：授权查询/下载全部由 worker 后台完成。
        		# 旧版在这里同步查服务器（最长 20 秒），慢网会超过 RPC 超时，前端误报
        		# “启动失败”，而后台其实照常下载刷入重启（09/01 实锤）。
        		rm -f "$FW_TMP" "$FW_LOG" "$FW_META"
        		echo "preparing" > "$FW_STATE"
        		nohup "$0" _worker >/dev/null 2>&1 &
        		echo '{"started":true}'
        		;;
        	status)
        		do_status
        		;;
        	*)
        		# 兼容旧调用：与 start 相同（后台执行，update status 看进度）
        		rm -f "$FW_TMP" "$FW_LOG" "$FW_META"
        		echo "preparing" > "$FW_STATE"
        		nohup "$0" _worker >/dev/null 2>&1 &
        		echo '{"started":true}'
        		;;
        	esac
        	;;
        backup)
        	# 配置备份：sysupgrade -b 打 tar.gz，前端按 32KB 分片 base64 读走拼 Blob 下载。
        	# 分片读取是为绕开 ubus 单条消息对超大 stdout 的限制（整包一次性输出会截断/失败）。
        	case "$2" in
        	start)
        		rm -f "$BK_TMP"
        		sysupgrade -b "$BK_TMP" >/dev/null 2>&1
        		if [ -s "$BK_TMP" ]; then
        			echo "{\"size\":$(wc -c < "$BK_TMP")}"
        		else
        			echo '{"error":"backup-failed"}'
        			exit 1
        		fi
        		;;
        	read)
        		# $3=分片号（从 0 起） $4=分片字节数；dd 定长块 skip 定位，base64 压成单行
        		[ -f "$BK_TMP" ] || { echo '{"error":"no-backup"}'; exit 1; }
        		dd if="$BK_TMP" bs="$4" skip="$3" count=1 2>/dev/null | base64 | tr -d '\n'
        		echo
        		;;
        	clean)
        		rm -f "$BK_TMP"
        		echo '{"cleaned":true}'
        		;;
        	*)
        		echo "Usage: $0 backup {start|read <idx> <size>|clean}" >&2
        		exit 1
        		;;
        	esac
        	;;
        _worker)
        	do_worker
        	;;
        *)
        	echo "Usage: $0 {id|model|ver|check|update start|update status|backup start|backup read|backup clean}" >&2
        	exit 1
        	;;
        esac
        FWEOF
        chmod 755 $GITHUB_WORKSPACE/files/usr/sbin/tkubeos-fwcheck
        cat > $GITHUB_WORKSPACE/files/www/luci-static/resources/view/tkubeos/update.js <<'JSEOF'
        'use strict';
        'require view';
        'require fs';
        'require ui';
        
        var CHECK_SCRIPT = '/usr/sbin/tkubeos-fwcheck';
        var POLL_MS = 2000;
        
        return view.extend({
        	load: function () {
        		return Promise.all([
        			fs.exec(CHECK_SCRIPT, ['id']),
        			fs.exec(CHECK_SCRIPT, ['ver']),
        			fs.exec(CHECK_SCRIPT, ['model'])
        		]).catch(function () {
        			return [{ stdout: '' }, { stdout: '' }, { stdout: '' }];
        		});
        	},
        
        	render: function (res) {
        		var machineId = (res[0] && res[0].stdout) ? res[0].stdout.trim() : _('读取失败');
        		var curVer = (res[1] && res[1].stdout) ? res[1].stdout.trim() : _('读取失败');
        		var model = (res[2] && res[2].stdout) ? res[2].stdout.trim() : 'n60pro';
        
        		this.pollTimer = null;
        		this.failCount = 0;
        
        		this.statusEl = E('div', { 'class': 'alert-message', 'style': 'display:none' });
        
        		this.barInner = E('div', {
        			'style': 'width:0%;height:100%;background:#36a2eb;transition:width .5s;' +
        				'text-align:center;font-size:11px;line-height:18px;color:#fff;white-space:nowrap'
        		});
        		this.barWrap = E('div', {
        			'style': 'display:none;background:#e4e4e4;border-radius:3px;height:18px;' +
        				'margin:.6em 0;overflow:hidden'
        		}, this.barInner);
        
        		this.logEl = E('pre', {
        			'style': 'display:none;background:#f6f6f6;border:1px solid #ddd;padding:.5em;' +
        				'font-size:12px;max-height:8.5em;overflow:auto;white-space:pre-wrap;margin:.4em 0'
        		});
        
        		var btnCheck = E('button', {
        			'class': 'btn cbi-button cbi-button-action',
        			'click': ui.createHandlerFn(this, 'handleCheck')
        		}, [_('检查更新')]);
        
        		this.btnBackup = E('button', {
        			'class': 'btn cbi-button',
        			'click': ui.createHandlerFn(this, 'handleBackup')
        		}, [_('生成备份')]);
        
        		this.btnUpgrade = E('button', {
        			'class': 'btn cbi-button cbi-button-positive important',
        			'disabled': 'disabled',
        			'click': ui.createHandlerFn(this, 'handleUpgrade')
        		}, [_('立即更新')]);
        
        		return E('div', {}, [
        			E('h2', {}, [_('TKubeOS 固件更新')]),
        			E('div', { 'class': 'cbi-section' }, [
        				E('table', { 'class': 'table' }, [
        					E('tr', { 'class': 'tr' }, [
        						E('td', { 'class': 'td left', 'width': '33%' }, [_('设备机器号')]),
        						E('td', { 'class': 'td left' }, E('code', {}, machineId))
        					]),
        					E('tr', { 'class': 'tr' }, [
        						E('td', { 'class': 'td left' }, [_('设备型号')]),
        						E('td', { 'class': 'td left' }, E('code', {}, model))
        					]),
        					E('tr', { 'class': 'tr' }, [
        						E('td', { 'class': 'td left' }, [_('当前固件版本')]),
        						E('td', { 'class': 'td left' }, curVer)
        					])
        				]),
        				this.statusEl,
        				this.barWrap,
        				this.logEl,
        				E('div', { 'style': 'margin-top:.5em' }, [btnCheck, ' ', this.btnBackup, ' ', this.btnUpgrade])
        			])
        		]);
        	},
        
        	setStatus: function (msg, cls) {
        		this.statusEl.style.display = '';
        		this.statusEl.className = 'alert-message' + (cls ? ' ' + cls : '');
        		this.statusEl.textContent = msg;
        	},
        
        	setBar: function (percent, text) {
        		this.barWrap.style.display = '';
        		this.barInner.style.width = percent + '%';
        		this.barInner.textContent = text;
        	},
        
        	showLog: function (lines) {
        		if (!lines) return;
        		this.logEl.style.display = '';
        		this.logEl.textContent = lines;
        	},
        
        	parseJson: function (stdout) {
        		try {
        			return JSON.parse(stdout.trim());
        		} catch (e) {
        			return null;
        		}
        	},
        
        	handleCheck: function () {
        		this.setStatus(_('正在检查更新…'));
        		return fs.exec(CHECK_SCRIPT, ['check']).then(L.bind(function (res) {
        			var r = this.parseJson(res.stdout);
        			if (!r) {
        				this.setStatus(_('检查更新失败：服务器无响应'), 'error');
        				return;
        			}
        			if (!r.authorized) {
        				var reason = r.message ? String(r.message) : _('设备未激活');
        				if (r.code === 403) {
        					reason += _('，请把上方「设备机器号」发送给客服开通');
        				}
        				this.setStatus(_('无法获取更新：') + reason, 'warning');
        				return;
        			}
        			if (!r.has_update) {
        				this.setStatus(_('当前已是最新版本，无需更新'));
        				return;
        			}
        			this.setStatus(_('发现新版本：' + r.latest + '，点击「立即更新」开始升级。'));
        			this.btnUpgrade.disabled = null;
        		}, this)).catch(L.bind(function () {
        			this.setStatus(_('检查更新失败，请稍后重试'), 'error');
        		}, this));
        	},
        
        	handleBackup: function () {
        		// 生成备份 = 本地 sysupgrade -b 打 tar.gz，前端按 32KB 分片 base64 读回，
        		// 拼成 Blob 触发浏览器下载；完成后调 backup clean 删除临时文件。
        		// 全程走 ACL 允许的 fwcheck exec，不经静态 URL，配置密码不外泄。
        		var CHUNK = 32768;
        		var self = this;
        		this.btnBackup.disabled = 'disabled';
        		this.logEl.style.display = 'none';
        		this.setBar(1, '');
        		this.setStatus(_('正在生成配置备份…'));
        		return fs.exec(CHECK_SCRIPT, ['backup', 'start']).then(function (res) {
        			var r = self.parseJson(res.stdout);
        			if (res.code !== 0 || !r || !r.size)
        				throw new Error('backup-start-failed');
        			var total = r.size, parts = [], idx = 0;
        			function nextChunk() {
        				if (idx * CHUNK >= total)
        					return Promise.resolve();
        				return fs.exec(CHECK_SCRIPT, ['backup', 'read', String(idx), String(CHUNK)]).then(function (res2) {
        					var b64 = (res2.stdout || '').trim();
        					if (!b64 || b64.charAt(0) === '{')
        						throw new Error('backup-read-failed');
        					var bin = atob(b64), buf = new Uint8Array(bin.length);
        					for (var i = 0; i < bin.length; i++)
        						buf[i] = bin.charCodeAt(i);
        					parts.push(buf);
        					idx++;
        					self.setBar(Math.min(99, Math.floor(idx * CHUNK * 100 / total)), '');
        					self.setStatus(_('正在导出备份：') + Math.min(idx * CHUNK, total) + ' / ' + total + ' 字节');
        					return nextChunk();
        				});
        			}
        			return nextChunk().then(function () {
        				return fs.exec(CHECK_SCRIPT, ['backup', 'clean']);
        			}).then(function () {
        				var blob = new Blob(parts, { type: 'application/gzip' });
        				var d = new Date();
        				var pad = function (n) { return (n < 10 ? '0' : '') + n; };
        				var name = 'tkubeos-backup-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
        					'-' + pad(d.getHours()) + pad(d.getMinutes()) + '.tar.gz';
        				var a = E('a', { href: URL.createObjectURL(blob), download: name });
        				document.body.appendChild(a);
        				a.click();
        				document.body.removeChild(a);
        				setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
        				self.barWrap.style.display = 'none';
        				self.setStatus(_('备份已生成并开始下载：') + name + '（' + total + ' 字节）');
        				self.btnBackup.disabled = null;
        			});
        		}).catch(function () {
        			fs.exec(CHECK_SCRIPT, ['backup', 'clean']);
        			self.barWrap.style.display = 'none';
        			self.setStatus(_('生成备份失败，请重试'), 'error');
        			self.btnBackup.disabled = null;
        		});
        	},
        
        	handleUpgrade: function () {
        		if (!confirm(_('升级过程中设备将自动重启并短暂断网，期间请勿断电。确定继续？')))
        			return;
        
        		this.btnUpgrade.disabled = 'disabled';
        		this.setBar(2, '');
        		this.setStatus(_('正在启动后台升级…'));
        		this.failCount = 0;
        
        		// start 是纯本地命令（秒回）。即便这次 RPC 出异常，后台线程也可能已启动，
        		// 所以不判失败，直接转入进度轮询兜底（旧版在这里判“启动失败”，但设备其实
        		// 照常升级重启——09/01 实锤）。
        		var startPoll = L.bind(function () {
        			if (!this.pollTimer)
        				this.pollTimer = window.setInterval(L.bind(this.pollStatus, this), POLL_MS);
        		}, this);
        
        		return fs.exec(CHECK_SCRIPT, ['update', 'start']).then(L.bind(function (res) {
        			var r = this.parseJson(res.stdout);
        			if (res.code !== 0 || !r || !r.started) {
        				// 启动异常不直接报错：转入轮询，由连续失败来最终判定
        				this.setStatus(_('启动较慢，正在跟踪后台进度…'));
        			} else {
        				this.setStatus(_('已启动后台升级，进度如下：'));
        			}
        			startPoll();
        		}, this)).catch(L.bind(function () {
        			this.setStatus(_('启动较慢，正在跟踪后台进度…'));
        			startPoll();
        		}, this));
        	},
        
        	pollStatus: function () {
        		fs.exec(CHECK_SCRIPT, ['update', 'status']).then(L.bind(function (res) {
        			var r = this.parseJson(res.stdout);
        			if (!r) return;
        			this.failCount = 0;
        			if (r.log) this.showLog(r.log);
        
        			switch (r.stage) {
        			case 'preparing':
        				this.setBar(2, '');
        				this.setStatus(_('正在检查授权与更新信息…'));
        				break;
        			case 'downloading':
        				this.setBar(r.percent || 2, (r.percent || 0) + '%');
        				this.setStatus(_('正在下载固件：') + (r.detail || ''));
        				break;
        			case 'verifying':
        				this.setBar(100, '100%');
        				this.setStatus(_('下载完成，正在校验固件完整性…'));
        				break;
        			case 'flashing':
        				window.clearInterval(this.pollTimer);
        				this.setBar(100, '100%');
        				this.setStatus(_('校验通过，正在刷入固件并重启。约 3 分钟后刷新本页面即可。'));
        				window.setTimeout(function () { location.reload(); }, 180000);
        				break;
        			case 'done-noflash':
        				window.clearInterval(this.pollTimer);
        				this.setBar(100, '100%');
        				this.setStatus(_('调试模式：固件校验通过，未刷入'));
        				this.btnUpgrade.disabled = null;
        				break;
        			default:
        				if (r.stage && r.stage.indexOf('error') === 0) {
        					this.upgradeFail(r.detail || _('升级失败，请重新点击立即更新'));
        				}
        			}
        		}, this)).catch(L.bind(function () {
        			// 刷入重启期间通信会短暂中断，多容忍几次再判失败；
        			// 期间给温和提示，避免页面看起来像卡死（旧版只在最后才提示）
        			this.failCount++;
        			if (this.failCount > 10) {
        				this.upgradeFail(_('与设备的通信中断超过 20 秒，请刷新页面查看结果'));
        			} else if (this.failCount >= 3) {
        				this.setStatus(_('正在等待设备响应…（升级或重启中属正常现象）'));
        			}
        		}, this));
        	},
        
        	upgradeFail: function (msg) {
        		window.clearInterval(this.pollTimer);
        		this.setStatus(msg, 'error');
        		this.btnUpgrade.disabled = null;
        	}
        });
        JSEOF
        cat > $GITHUB_WORKSPACE/files/usr/share/luci/menu.d/luci-app-tkubeos-update.json <<'MEOF'
        {
        	"admin/system/tkubeos-update": {
        		"title": "固件更新",
        		"order": 95,
        		"action": {
        			"type": "view",
        			"path": "tkubeos/update"
        		},
        		"depends": {
        			"acl": ["luci-app-tkubeos-update"]
        		}
        	}
        }
        MEOF
        cat > $GITHUB_WORKSPACE/files/usr/share/rpcd/acl.d/tkubeos-update.json <<'AEOF'
        {
        	"luci-app-tkubeos-update": {
        		"description": "Grant access to TKubeOS firmware update",
        		"read": {
        			"ubus": {
        				"file": ["exec", "read"]
        			},
        			"file": {
        				"/usr/sbin/tkubeos-fwcheck": ["exec"],
        				"/etc/tkubeos_version": ["read"],
        				"/usr/share/tkubeos/version": ["read"]
        			}
        		},
        		"write": {
        			"ubus": {
        				"file": ["exec"]
        			},
        			"file": {
        				"/usr/sbin/tkubeos-fwcheck": ["exec"]
        			}
        		}
        	}
        }
        AEOF
        # 版本号格式：年.月.日.时分（服务端用 version_compare 比较大小）；
        # 型号标识决定服务端从 files/<型号>/ 目录分发固件，两条线都是 N60PRO 设备，均为 n60pro。
        echo "$(date +%Y.%m.%d.%H%M)" > $GITHUB_WORKSPACE/files/usr/share/tkubeos/version
        echo "n60pro" > $GITHUB_WORKSPACE/files/usr/share/tkubeos/model
        # 版本号当场固化到 GITHUB_ENV：后续 Load custom configuration 步骤会把 files/ 并入
        # openwrt/ 源码树并 rm -rf files，发布步骤再按原路径 cat 必然落空，
        # Release 就会显示“固件版本：未知”（实锤 bug，改用环境变量跨步骤传递）。
        echo "TKUBEOS_VERSION=$(cat $GITHUB_WORKSPACE/files/usr/share/tkubeos/version)" >> $GITHUB_ENV
        echo "########## 验证：TKubeOS 在线更新文件（应为 6 个；版本号为 年.月.日.时分 格式）##########"
        ls -l $GITHUB_WORKSPACE/files/usr/sbin/tkubeos-fwcheck $GITHUB_WORKSPACE/files/www/luci-static/resources/view/tkubeos/update.js $GITHUB_WORKSPACE/files/usr/share/luci/menu.d/luci-app-tkubeos-update.json $GITHUB_WORKSPACE/files/usr/share/rpcd/acl.d/tkubeos-update.json $GITHUB_WORKSPACE/files/usr/share/tkubeos/version $GITHUB_WORKSPACE/files/usr/share/tkubeos/model
        echo "version: $(cat $GITHUB_WORKSPACE/files/usr/share/tkubeos/version)  model: $(cat $GITHUB_WORKSPACE/files/usr/share/tkubeos/model)"
        echo "########## 验证：备份功能注入（backup case 应为 1；handleBackup 应为 2）与 ttyd 禁用/默认主题脚本 ##########"
        grep -c '^backup)' $GITHUB_WORKSPACE/files/usr/sbin/tkubeos-fwcheck
        grep -c 'handleBackup' $GITHUB_WORKSPACE/files/www/luci-static/resources/view/tkubeos/update.js
        ls -l $GITHUB_WORKSPACE/files/etc/uci-defaults/98-disable-ttyd
        ls -l $GITHUB_WORKSPACE/files/etc/uci-defaults/99-set-default-theme

    - name: Load custom configuration
      run: |
        # 237 仓库自带顶层 files/ 目录，直接 mv 会把自定义文件嵌套成 files/files/（09/01 实锤：
        # 升级脚本被打进 /files/etc/uci-defaults/ 而非 /etc/uci-defaults/，首启不会执行）。
        # 改为合并拷贝：把工作区 files/ 的内容并入源码树 files/，仓库原有内容也不受影响。
        if [ -e files ]; then mkdir -p openwrt/files && cp -a files/. openwrt/files/ && rm -rf files; fi
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        # ===== 编译前最后一道防线：全树清除 ttyd（含硬依赖）=====
        # 09/02 设备端实锤真根因：luci-app-turboacc-mtk（MTK 厂商加速 app，config 选中）
        # 的 DEPENDS 带 +luci-app-ttyd 硬依赖，“+”前缀在 make defconfig 时强制选中，
        # config “is not set” 直接被推翻，连带拉进 ttyd 守护进程与中文包。
        # （DEFAULT_PACKAGES 的 sed 与 98-disable-ttyd 兜底都对，但都拦不住“+”依赖。）
        # 修法：make defconfig 前扫掉 package/、feeds/ 全部 Makefile 里的 +luci-app-ttyd、
        # +ttyd 依赖记号，再对 target/linux 做 DEFAULT_PACKAGES/DEVICE_PACKAGES 清扫。
        grep -rl --include='Makefile' -e '+luci-app-ttyd' -e '+ttyd\b' package/ feeds/ 2>/dev/null | xargs -r sed -i -e 's/+luci-app-ttyd//g' -e 's/+ttyd\b//g'
        grep -rlE --include='Makefile' --include='*.mk' '\bttyd\b' target/linux/ 2>/dev/null | xargs -r sed -i -e 's/luci-i18n-ttyd-zh-cn //g' -e 's/luci-app-ttyd //g' -e 's/\bttyd\b//g'
        echo "########## 验证：ttyd 硬依赖与默认包残留（均应为空）##########"
        grep -rn --include='Makefile' -e '+luci-app-ttyd' -e '+ttyd\b' package/ feeds/ 2>/dev/null && echo "!!! 警告：仍有包硬依赖 ttyd，固件将带网页终端 !!!" || echo "确认：package/feeds 已无 +ttyd 系硬依赖"
        if grep -rnE --include='Makefile' --include='*.mk' '\bttyd\b' target/linux/ 2>/dev/null; then
          echo "!!! 警告：target/linux 下仍残留 ttyd 条目 !!!"
        else
          echo "确认：target/linux 全树已无 ttyd 条目"
        fi
        # ===== 克隆两个定制主题进 package/（必须在 make defconfig 之前，CONFIG 符号才会生成）=====
        # shadcn：仓库根目录即包（Makefile+htdocs+ucode，PKG_VERSION 已硬编码）。
        # footstrap：包在仓库子目录 luci-theme-footstrap/，其 Build/Prepare 只用 cat/awk/sed
        # （上游明确支持无 node 环境构建）；版本号靠 FOOTSTRAP_VERSION 注入（空值有边界风险），
        # 从克隆的 git 头提交日期派生，经 GITHUB_ENV 传给后续编译步骤。
        # 如需换成带 CSS 定制的 fork/tag，只改文件头 env 的两个 THEME_*_REPO 即可。
        rm -rf package/tkubeos-themes /tmp/footstrap-src
        mkdir -p package/tkubeos-themes
        git clone --depth 1 $THEME_SHADCN_REPO package/tkubeos-themes/luci-theme-shadcn
        git clone --depth 1 $THEME_FOOTSTRAP_REPO /tmp/footstrap-src
        cp -a /tmp/footstrap-src/luci-theme-footstrap package/tkubeos-themes/luci-theme-footstrap
        echo "FOOTSTRAP_VERSION=$(git -C /tmp/footstrap-src log -1 --format=%cd --date=format:%Y%m%d)-tkubeos" >> $GITHUB_ENV
        echo "########## 验证：主题包就位（应为 2 个 Makefile）##########"
        ls -l package/tkubeos-themes/luci-theme-shadcn/Makefile package/tkubeos-themes/luci-theme-footstrap/Makefile
        # ===== 设置向导挪进「系统」一级导航 =====
        # 原菜单键是顶层 admin/netwizard（09/05 设备端实锤），整条搬到 admin/system/netwizard，
        # order=3 排在「系统」子菜单靠前位置；title/acl 依赖原样保留（中文标题由 i18n 包翻译）。
        NETWIZARD_JSON="$(find -L package feeds -path '*menu.d/luci-app-netwizard.json' 2>/dev/null | head -1)"
        if [ -n "$NETWIZARD_JSON" ]; then
          python3 - "$NETWIZARD_JSON" <<'PYEOF'
        import json, sys
        p = sys.argv[1]
        with open(p, encoding='utf-8') as f:
            d = json.load(f)
        entry = d.pop('admin/netwizard', None)
        if entry is None:
            print('admin/netwizard 不存在（可能上游已改结构），现有键：', list(d.keys()))
        else:
            entry['order'] = 3
            d['admin/system/netwizard'] = entry
            with open(p, 'w', encoding='utf-8') as f:
                json.dump(d, f, indent='\t', ensure_ascii=False)
                f.write('\n')
            print('netwizard 菜单已移至 admin/system/netwizard:', p)
        PYEOF
        else
          echo "!!! 警告：未找到 luci-app-netwizard.json，向导菜单位置未调整 !!!"
        fi
        echo "########## 验证：向导菜单键（应为 admin/system/netwizard）##########"
        grep -o '"admin/[a-z/]*netwizard"' "${NETWIZARD_JSON:-/dev/null}" || true
        make defconfig
        echo "########## 诊断：目标设备选择 ##########"
        grep -E '^CONFIG_TARGET_DEVICE.*=y' .config || echo "!!! 警告：未选中任何设备，固件将不会生成 !!!"
        echo "########## 诊断：Rust 相关依赖 ##########"
        grep -E 'SHADOWSOCKS_RUST|PACKAGE_rust|TUIC_CLIENT|SHADOW_TLS|DNS2SOCKS_RUST' .config | grep -v 'not set' || echo "无 rust 系包被选中"
        echo "########## 诊断：关键插件选中状态 ##########"
        grep -E '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-ssr-plus|luci-app-homeproxy|luci-app-netwizard|sing-box)=y' .config || echo "!!! 警告：没有任何代理插件被选中，请检查 config 和 feed !!!"
        echo "########## 诊断：主题选中状态（应见 shadcn/footstrap=y，不应见 argon/bootstrap-mod）##########"
        grep -E '^CONFIG_PACKAGE_luci-theme-.*=y' .config || echo "!!! 警告：没有任何主题被选中，LuCI 将无法正常渲染 !!!"
        echo "########## 诊断：固件版本标识（品牌化）##########"
        grep -E '^CONFIG_(IMAGEOPT|VERSIONOPT|VERSION_DIST|VERSION_MANUFACTURER|VERSION_PRODUCT)=' .config || echo "!!! 警告：品牌化配置被 defconfig 丢弃，固件将显示 ImmortalWrt !!!"
        echo "########## 诊断：TKubeOS 在线更新文件已并入源码树 ##########"
        ls openwrt/files/usr/sbin/tkubeos-fwcheck openwrt/files/usr/share/tkubeos/version openwrt/files/usr/share/tkubeos/model >/dev/null 2>&1 && echo "OK：在线更新文件就位（版本 $(cat openwrt/files/usr/share/tkubeos/version)）" || echo "!!! 警告：在线更新文件缺失，固件将没有 LuCI 固件更新页 !!!"
        echo "########## 诊断：defconfig 展开摘要 ##########"
        ./scripts/diffconfig.sh | head -60 || true
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        # 只发布 sysupgrade 固件；initramfs（内存救援镜像）、bl2、buildinfo、manifest 等一律不发布
        find . -maxdepth 1 -type f ! -name '*-squashfs-sysupgrade.bin' -delete
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # 优化：产物目录为空时直接报错，杜绝"全绿但没固件"
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: error

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${{ env.FIRMWARE_TAG }}" >> $GITHUB_OUTPUT
        cat > release.txt <<EOF
        ### TKubeOS · Netcore N60 PRO 定制固件（237 6.6线 / 6.6内核）
        - 构建时间：$(date +"%Y-%m-%d %H:%M")
        - 固件版本：${TKUBEOS_VERSION:-未知}
        - 默认地址：192.168.1.1 | root 密码：www666
        - WiFi：TKubeOS-2.4G / TKubeOS-5G
        - 界面主题：shadcn（默认）/ footstrap（系统→系统→语言和界面 可切换）
        - 在线更新：LuCI「系统 → 固件更新」（激活设备可一键检查并升级，「生成备份」导出当前配置）
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    # 优化：没有匹配文件时 Release 直接失败，不会再出现空 Release
    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        fail_on_unmatched_files: true

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 6
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
