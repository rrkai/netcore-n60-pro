#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/padavanonly-immortalwrt-mt798x-6.6-builder.yml
# Description: TKubeOS — Netcore N60 PRO 定制固件云编译（237 6.6线 / 6.6内核）
#

name: TKubeOS-6.6-builder

on:
  repository_dispatch:
  workflow_dispatch:

# 优化：重复触发时自动取消旧的运行，避免浪费 Actions 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: padavanonly-immortalwrt-mt798x-6.6.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part5-6.6.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  FIRMWARE_TAG: TKubeOS-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        # ===== 钉死 luci-app-passwall 版本为 26.8.26-1 =====
        # feeds update 后 passwall feed 停在 main 最新，checkout 到 tag 钉住版本，
        # 避免上游后续更新导致固件行为变化。必须在 update -i 重建索引之前完成，
        # 否则索引记录的还是 main 的版本。
        cd feeds/passwall
        git checkout tags/26.8.26-1
        echo "########## 验证：passwall 钉版本结果（应为 26.8.26 / release 1）##########"
        grep -E 'PKG_VERSION|PKG_RELEASE' luci-app-passwall/Makefile
        # ===== 把 api.lua 里的 GitHub 反代地址换成自有的 =====
        # api.lua 两处硬编码（更新查询 + 内核下载）都是 https://gh-proxy.org/，
        # 要求前缀拼接型反代（反代地址/完整原始URL），gh.tkubeos.com 即自有反代。
        sed -i 's|https://gh-proxy.org/|https://gh.tkubeos.com/|g' luci-app-passwall/luasrc/passwall/api.lua
        echo "########## 验证：反代替换结果（应为 2 处 gh.tkubeos.com、0 处残留）##########"
        echo "gh.tkubeos.com 出现: $(grep -c 'gh\.tkubeos\.com' luci-app-passwall/luasrc/passwall/api.lua)"
        echo "gh-proxy.org 残留: $(grep -c 'gh-proxy\.org' luci-app-passwall/luasrc/passwall/api.lua || true)"
        cd ../..
        # 官方 luci feed 内置了旧版 luci-app-passwall（25.12.x），同名包会挤掉我们的新源。
        # 必须三步走：1) 删掉官方内置版源码  2) update -i 重建索引（关键！只删目录不重建索引，
        # 旧索引仍会照旧版占位，导致 passwall feed 被静默跳过、零包安装）  3) 再 install。
        rm -rf feeds/luci/applications/luci-app-passwall
        ./scripts/feeds update -i
        ./scripts/feeds install -a
        rm -rf package/feeds/luci/luci-app-passwall package/feeds/luci/luci-i18n-passwall-zh-cn
        echo "########## 验证：passwall 包来源（必须指向 feeds/passwall）##########"
        ls -l package/feeds/*/luci-app-passwall || echo "!!! 严重警告：passwall 包未安装，固件将缺少 PassWall !!!"
        # ===== 钉死 Xray 内核为 26.6.27 =====
        # 官方 packages feed（immortalwrt/packages openwrt-24.10）自带 net/xray-core 且排在
        # passwall_packages 前面，同名包先到先得，旧版 25.2.21 会静默压制新版——而新版
        # PassWall 的配置用了 tunnel 入站（Xray ≥25.7.26 才支持），旧内核会报
        # "unknown config id: tunnel" 启动失败。必须改官方 feed 的 Makefile 而不是 passwall feed 的。
        # PKG_HASH 取自 Openwrt-Passwall/openwrt-passwall-packages 升级到 26.6.27 的提交（cbc29f1），
        # 与 XTLS/Xray-core v26.6.27 源码包精确匹配。
        sed -i 's/PKG_VERSION:=25\.2\.21/PKG_VERSION:=26.6.27/' feeds/packages/net/xray-core/Makefile
        sed -i 's/PKG_HASH:=.*/PKG_HASH:=3c2c13dbe9dfc8d0f83436566efcf76efb8b3d6f64f37499aea3d8e14d1c559b/' feeds/packages/net/xray-core/Makefile
        echo "########## 验证：xray-core 钉版本结果（必须为 26.6.27 + 3c2c13db…559b）##########"
        grep -E 'PKG_VERSION|PKG_HASH' feeds/packages/net/xray-core/Makefile

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        echo "########## 诊断：目标设备选择 ##########"
        grep -E '^CONFIG_TARGET_DEVICE.*=y' .config || echo "!!! 警告：未选中任何设备，固件将不会生成 !!!"
        echo "########## 诊断：Rust 相关依赖 ##########"
        grep -E 'SHADOWSOCKS_RUST|PACKAGE_rust|TUIC_CLIENT|SHADOW_TLS|DNS2SOCKS_RUST' .config | grep -v 'not set' || echo "无 rust 系包被选中"
        echo "########## 诊断：关键插件选中状态 ##########"
        grep -E '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-ssr-plus|luci-app-homeproxy|luci-app-netwizard|sing-box)=y' .config || echo "!!! 警告：没有任何代理插件被选中，请检查 config 和 feed !!!"
        echo "########## 诊断：固件版本标识（品牌化）##########"
        grep -E '^CONFIG_(IMAGEOPT|VERSIONOPT|VERSION_DIST|VERSION_MANUFACTURER|VERSION_PRODUCT)=' .config || echo "!!! 警告：品牌化配置被 defconfig 丢弃，固件将显示 ImmortalWrt !!!"
        echo "########## 诊断：defconfig 展开摘要 ##########"
        ./scripts/diffconfig.sh | head -60 || true
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        # 只发布 sysupgrade 固件；initramfs（内存救援镜像）、bl2、buildinfo、manifest 等一律不发布
        find . -maxdepth 1 -type f ! -name '*-squashfs-sysupgrade.bin' -delete
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # 优化：产物目录为空时直接报错，杜绝"全绿但没固件"
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: error

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${{ env.FIRMWARE_TAG }}" >> $GITHUB_OUTPUT
        cat > release.txt <<EOF
        ### TKubeOS · Netcore N60 PRO 定制固件（237 6.6线 / 6.6内核）
        - 构建时间：$(date +"%Y-%m-%d %H:%M")
        - 默认地址：192.168.1.1 | root 密码：www666
        - WiFi：TKubeOS-2.4G / TKubeOS-5G
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    # 优化：没有匹配文件时 Release 直接失败，不会再出现空 Release
    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        fail_on_unmatched_files: true

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 6
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
